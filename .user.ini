; Límites compatibles con los lotes de 6 imágenes de la aplicación móvil.
; En VPS puede trasladarse esta configuración a php.ini o al pool PHP-FPM.
upload_max_filesize=12M
post_max_size=80M
max_file_uploads=10
memory_limit=512M
max_execution_time=300
max_input_time=300
display_errors=Off
log_errors=On
