name: pruebaoffline
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  http: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.1.0
  cupertino_icons: ^1.0.8
  exif: ^3.3.0
  location: ^5.0.0
  image_picker: ^0.8.7+3
  flutter_svg: ^2.0.7
  provider: ^6.0.5
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  connectivity_plus: ^4.0.2
  jwt_decoder: ^2.0.1
  path: ^1.8.0
  permission_handler: ^11.3.1
  geolocator: ^14.0.1
  intl: ^0.18.1
  # --- P0 integridad de datos (ambas ya estaban en el árbol de dependencias) ---
  crypto: ^3.0.6   # checksum SHA-256 de cada fotografía (idempotencia + integridad)
  uuid: ^4.5.1     # identificador local estable para fotos y borradores
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1
  sqflite_common_ffi: ^2.3.3   # permite probar migraciones y repositorios sin emulador

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/logo.png"
