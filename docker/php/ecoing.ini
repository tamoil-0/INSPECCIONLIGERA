; ECOING - Inspección Ligera · php.ini del contenedor
;
; Equivalente a `.user.ini` del repositorio, que solo tiene efecto con CGI/FPM.
; Aquí se usa mod_php, así que los mismos límites viven en un .ini real.

[PHP]
; --- Subida de fotografías ---------------------------------------------------
; La app Flutter envía lotes pequeños (por defecto 3 archivos simultáneos, ver
; ContratoFotos/Entorno) con fotos que rara vez pasan de 3 MB tras la compresión
; nativa del teléfono. El techo de 12 MB por archivo deja margen para el caso en
; que la compresión se omita y se suba el original.
upload_max_filesize = 12M
post_max_size = 100M
max_file_uploads = 20

; --- Memoria y tiempo --------------------------------------------------------
; 512M cubre el peor caso medido: PhpSpreadsheet con una línea completa y la
; generación del ZIP de PDF de una línea.
memory_limit = 512M
max_execution_time = 900
max_input_time = 900

; --- Errores -----------------------------------------------------------------
; La aplicación fija display_errors/error_log en api/config/app.php según
; APP_DEBUG y LOG_STORAGE_PATH. Estos valores son la red de seguridad para
; cualquier error que ocurra antes de que ese archivo se cargue.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; --- Cabeceras ---------------------------------------------------------------
expose_php = Off

; --- Zona horaria ------------------------------------------------------------
; app.php la vuelve a fijar desde APP_TIMEZONE; esto evita el aviso previo.
date.timezone = America/Lima

; --- Sesiones ----------------------------------------------------------------
; El sistema es stateless (JWT en Authorization). No se usan sesiones PHP, pero
; si alguna librería las abriera, que sea con cookies seguras.
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

[opcache]
; En un Cortex-A57 recompilar cada petición cuesta caro. Con opcache el arranque
; de un endpoint del API baja de ~90 ms a ~25 ms.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
; 0 = no comprobar mtime en cada petición. La imagen es inmutable: el código
; solo cambia al reconstruirla, y entonces el contenedor se recrea.
; Si se monta el código con bind mount para desarrollo, poner 1 (ver
; docker-compose.dev.yml, que sobreescribe este valor).
opcache.validate_timestamps = 0
opcache.save_comments = 1
