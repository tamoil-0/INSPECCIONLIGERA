# ECOING - Inspección Ligera · endurecimiento de Apache
#
# Objetivo 14/16: la LAN no es una excusa para bajar la guardia, y el health
# check no debe delatar versiones.

# No publicar "Apache/2.4.x (Debian)" ni en cabeceras ni en páginas de error.
ServerTokens Prod
ServerSignature Off

# Sin FQDN el arranque emite un aviso en cada inicio del contenedor.
ServerName ecoing-app

# El backend responde JSON o binarios; nunca necesita seguir enlaces raros.
TraceEnable Off

# Tiempos generosos: la subida de un lote de fotografías por WiFi de oficina y
# la generación de un ZIP con los PDF de una línea completa son lentas por
# naturaleza, no por un fallo.
# Margen sobre las 2 horas permitidas al generador de ZIP de líneas grandes.
Timeout 7500
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# Techo de cuerpo de petición: 100 MB. Coincide con el límite que ya valida
# api/postes/imagenes-poste.php (CONTENT_LENGTH > 100 MB -> 413), de modo que
# Apache y PHP rechazan lo mismo y la app Flutter recibe el 413 que sabe
# interpretar para dividir el lote.
LimitRequestBody 104857600
