# ECOING - Inspección Ligera · vhost de `ecoing-app`
#
# DocumentRoot = /var/www/html, que contiene EXACTAMENTE dos carpetas:
#
#   /var/www/html/web/   -> web administrativa   http://NAS:8082/web/
#   /var/www/html/api/   -> API REST             http://NAS:8082/api/...
#
# Se elige la raíz del proyecto (y no `web/` directamente) para no romper nada:
# `web/js/app.js` deriva la URL del API buscando el marcador `/web/` en la ruta
# actual, de modo que con este DocumentRoot obtiene `http://NAS:8082/api`, igual
# que hacía bajo XAMPP en `http://localhost/INSPEECIONLIGERAECOING/web/`.
# La app Flutter apunta a `http://NAS:8082/api` sin cambios de contrato.
#
# `database/`, `scripts/`, `docs/`, `storage/` y `pruebaoffline/` NO se copian a
# la imagen (ver .dockerignore), así que no hay nada más que exponer aquí.

<VirtualHost *:80>
    DocumentRoot /var/www/html

    # `/` -> web administrativa.
    RedirectMatch 302 "^/$" "/web/"

    <Directory /var/www/html>
        Options -Indexes -FollowSymLinks +SymLinksIfOwnerMatch
        AllowOverride None
        Require all granted
        DirectoryIndex index.html index.php
    </Directory>

    # --- Web administrativa -------------------------------------------------
    <Directory /var/www/html/web>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # --- API ----------------------------------------------------------------
    <Directory /var/www/html/api>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex disabled
    </Directory>

    # Carpetas del API que solo se incluyen desde PHP (`require_once`) y que
    # nunca deben responder por HTTP.
    <DirectoryMatch "^/var/www/html/api/(vendor|config|clases|services)(/|$)">
        Require all denied
    </DirectoryMatch>

    # Archivos que jamás deben servirse aunque acaben dentro del DocumentRoot.
    <FilesMatch "(?i)(^\.|^composer\.(json|lock)$|\.(env|ini|sql|log|md|lock|zip|bak|sh)$)">
        Require all denied
    </FilesMatch>

    # La configuración llega por variables de entorno de Container Station.
    # `envValue()` (api/config/app.php) las lee con getenv(); PassEnv las publica
    # además en el entorno del SAPI de Apache, para no depender de que el
    # entorno del proceso se herede íntegro.
    PassEnv APP_ENV
    PassEnv APP_DEBUG
    PassEnv APP_URL
    PassEnv APP_TIMEZONE
    PassEnv APP_ENV_FILE
    PassEnv CORS_ALLOWED_ORIGINS
    PassEnv DB_HOST
    PassEnv DB_PORT
    PassEnv DB_DATABASE
    PassEnv DB_USERNAME
    PassEnv DB_PASSWORD
    PassEnv JWT_SECRET
    PassEnv JWT_TTL
    PassEnv STORAGE_DRIVER
    PassEnv IMAGE_STORAGE_PATH
    PassEnv PDF_STORAGE_PATH
    PassEnv BACKUP_STORAGE_PATH
    PassEnv LOG_STORAGE_PATH
    PassEnv EXPORT_STORAGE_PATH
    PassEnv PDF_CACHE_ENABLED
    PassEnv IMAGE_MAX_DIMENSION
    PassEnv IMAGE_REENCODE_MODE
    PassEnv UPLOAD_METRICS_ENABLED
    PassEnv SUPERVISOR_CLIENTE_NOMBRE
    PassEnv SUPERVISOR_CLIENTE_CIP
    PassEnv SUPERVISOR_CONTRATISTA_NOMBRE
    PassEnv SUPERVISOR_CONTRATISTA_CIP

    # Logs de Apache a la salida estándar del contenedor: Container Station los
    # muestra en su visor. Los del *aplicativo* van a /data/logs (persistentes).
    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
    LogLevel warn
</VirtualHost>
